name: xlive_mobile
description: Xlive mobile app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  circle_flags: ^5.0.1
  country_picker: ^2.0.27
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  agora_rtc_engine: ^6.5.0
  permission_handler: ^11.4.0
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.1
  speech_to_text: ^7.3.0
  record: ^6.2.1
  just_audio: ^0.10.5
  path_provider: ^2.1.6
  video_player: ^2.9.5
  video_thumbnail: ^0.5.6
  ffmpeg_kit_flutter_new_min: ^3.3.2
  image: ^4.9.1
  file_picker: ^11.0.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon_dark.png
  adaptive_icon_background: "#5B21B6"
  adaptive_icon_foreground: assets/app_icon_dark.png
  remove_alpha_ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/Bg Img.png
    - assets/app_icon_light.png
    - assets/app_icon_dark.png
    - assets/Group.png
    - assets/onboarding/Onboarding background.png
    - assets/onboarding/1/Img Wrapper.png
    - assets/onboarding/2/Container.png
    - assets/onboarding/2/Img.png
    - assets/onboarding/3/Img.png
